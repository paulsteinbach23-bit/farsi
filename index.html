<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F1E7" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#15130F" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json?v=2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="تعارف" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png" />

  <title>تعارف app — Farsi lernen</title>
  <link rel="stylesheet" href="css/style.css?v=6" />
  <script>
    (function() {
      const t = localStorage.getItem('farsi_theme');
      if (t === 'dark') document.documentElement.classList.add('theme-dark');
      else              document.documentElement.classList.add('theme-light');
    })();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        window.location.reload();
      });
    }
  </script>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo" lang="und">
      <span class="logo-mark" dir="rtl" lang="fa">تعارف</span>
      <span class="logo-suffix" lang="en">app</span>
    </div>
    <div class="header-actions">
      <div class="streak-badge" id="streak-badge" role="img" aria-label="Lernserie">
        <span class="streak-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></span>
        <span id="streak-count">0</span>
      </div>
      <button type="button" class="header-btn lang-btn" id="lang-btn" onclick="openLangScreen()" aria-label="Sprache wählen">FA</button>
      <button type="button" id="theme-toggle" class="header-btn theme-toggle-btn" onclick="toggleTheme()" aria-label="Hell- und Dunkelmodus wechseln"></button>
    </div>
  </div>
</header>

<!-- LANGUAGE SELECTION SCREEN -->
<div class="lang-screen" id="lang-screen">
  <div class="lang-screen-header">
    <button class="lang-screen-back" onclick="closeLangScreen()" aria-label="Schließen">✕</button>
    <span class="lang-screen-title">Sprache wählen</span>
    <div style="width:44px"></div>
  </div>
  <div class="lang-screen-body">
    <button class="lang-card" id="lang-card-farsi" onclick="selectLang('farsi')">
      <span class="lang-card-flag">🇮🇷</span>
      <div class="lang-card-info">
        <span class="lang-card-name">Farsi</span>
        <span class="lang-card-sub">Persisch · 1000 Wörter</span>
      </div>
      <span class="lang-card-check">✓</span>
    </button>
    <button class="lang-card" id="lang-card-french" onclick="selectLang('french')">
      <span class="lang-card-flag">🇫🇷</span>
      <div class="lang-card-info">
        <span class="lang-card-name">Français</span>
        <span class="lang-card-sub">Französisch · 1000 Wörter</span>
      </div>
      <span class="lang-card-check">✓</span>
    </button>
    <button class="lang-card" id="lang-card-spanish" onclick="selectLang('spanish')">
      <span class="lang-card-flag">🇪🇸</span>
      <div class="lang-card-info">
        <span class="lang-card-name">Español</span>
        <span class="lang-card-sub">Spanisch · 1000 Wörter</span>
      </div>
      <span class="lang-card-check">✓</span>
    </button>
  </div>
</div>

<div class="app">

  <!-- LESSONS -->
  <div id="lessons" class="screen">
    <div class="section-title">Lektionen</div>
    <div id="daily-progress" class="daily-progress"></div>
    <div id="lessons-grid" class="lessons-grid"></div>
  </div>

  <!-- FLASHCARDS (Lernen) -->
  <div id="flash" class="screen active">
    <section class="fc-head">
      <div class="fc-head-row">
        <div>
          <div class="fc-lesson-num" id="fc-lesson-num"></div>
          <div class="fc-lesson-theme" id="fc-lesson-theme"></div>
        </div>
        <div class="fc-count"><strong id="fc-done-count">0</strong> / <span id="fc-total">0</span> Karten</div>
      </div>
      <div class="fc-segbar" aria-hidden="true">
        <div class="seg seg-new" id="fc-seg-new"></div>
        <div class="seg seg-rev" id="fc-seg-rev"></div>
        <div class="seg seg-open" id="fc-seg-open"></div>
      </div>
      <div class="fc-legend">
        <span><span class="dot dot-new"></span><span id="fc-n-new">0</span> neu</span>
        <span><span class="dot dot-rev"></span><span id="fc-n-rev">0</span> wiederholt</span>
        <span><span class="dot dot-open"></span><span id="fc-n-open">0</span> offen</span>
      </div>
    </section>

    <button type="button" class="flip-card" id="flipcard" onclick="flipCard()" aria-label="Karte umdrehen und Bedeutung zeigen">
      <span class="flip-inner" id="flipinner">
        <span class="flip-face flip-front">
          <span class="fc-badge" id="fc-direction-badge">Erkennen</span>
          <span class="fc-topic" id="fc-topic"></span>
          <span class="fc-script" id="fc-script" dir="rtl" lang="fa"></span>
          <span class="fc-roman" id="fc-roman"></span>
          <span class="fc-hint" id="fc-hint">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
            Tippen zum Umdrehen
          </span>
        </span>
        <span class="flip-face flip-back">
          <span class="fc-badge">Bedeutung</span>
          <span class="fc-topic" id="fc-topic-back"></span>
          <span class="fc-back-script" id="fc-back-script" dir="rtl" lang="fa"></span>
          <span class="fc-back-roman" id="fc-back-roman"></span>
          <span class="fc-divider" aria-hidden="true"></span>
          <span class="fc-meaning" id="fc-meaning"></span>
          <span class="fc-note" id="fc-note"></span>
        </span>
      </span>
    </button>

    <div class="fc-placeholder" id="fc-placeholder">Erst umdrehen, dann bewerten</div>
    <div class="fc-actions" id="fc-actions">
      <button type="button" class="fc-btn fc-btn-again" onclick="rate(false)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>
        Nochmal
      </button>
      <button type="button" class="fc-btn fc-btn-good" onclick="rate(true)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
        Gewusst
      </button>
    </div>
    <div class="done-msg" id="fc-done-msg">
      <div class="done-title">Runde abgeschlossen!</div>
      <div class="done-sub" id="fc-score-msg"></div>
      <button type="button" class="fc-btn fc-btn-good fc-btn-inline" onclick="restartFlash()">Nochmal üben</button>
    </div>
  </div>

  <!-- NACHSCHLAGEN (Grammatik, Redewendungen, Wortschatz, Alphabet) -->
  <div id="lookup" class="screen">
    <div class="section-title">Nachschlagen</div>
    <div class="lookup-list">
      <button type="button" class="lookup-card" id="subnav-grammar" onclick="showSub('grammar', this)">
        <span class="lookup-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"></path><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"></path></svg></span>
        <span class="lookup-text"><span class="lookup-title">Grammatik</span><span class="lookup-sub">Regeln mit Beispielen</span></span>
      </button>
      <button type="button" class="lookup-card" id="subnav-phrasebook" onclick="showSub('phrases', this)">
        <span class="lookup-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></span>
        <span class="lookup-text"><span class="lookup-title">Redewendungen</span><span class="lookup-sub">Sätze für den Alltag</span></span>
      </button>
      <button type="button" class="lookup-card" id="subnav-vocab" onclick="showSub('vocab', this)">
        <span class="lookup-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg></span>
        <span class="lookup-text"><span class="lookup-title">Wortschatz</span><span class="lookup-sub">Alle Wörter nach Wortart</span></span>
      </button>
      <button type="button" class="lookup-card" id="subnav-alphabet" onclick="showSub('alphabet', this);buildAlphabet()">
        <span class="lookup-icon lookup-icon-fa" aria-hidden="true" lang="fa">الف</span>
        <span class="lookup-text"><span class="lookup-title">Alphabet</span><span class="lookup-sub">32 Buchstaben und ihre Formen</span></span>
      </button>
    </div>
  </div>

  <!-- VOCABULARY -->
  <div id="vocab" class="screen">
    <button type="button" class="back-link" onclick="showLookup()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 6 9 12 15 18"></polyline></svg>Nachschlagen</button>
    <div class="section-title">Wortschatz</div>
    <div class="grid3" id="topic-grid"></div>
  </div>

  <!-- GRAMMAR -->
  <div id="grammar" class="screen">
    <button type="button" class="back-link" onclick="showLookup()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 6 9 12 15 18"></polyline></svg>Nachschlagen</button>
    <div class="section-title">Grammatik</div>
    <div id="grammar-content"></div>
  </div>

  <!-- PHRASEBOOK -->
  <div id="phrases" class="screen">
    <button type="button" class="back-link" onclick="showLookup()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 6 9 12 15 18"></polyline></svg>Nachschlagen</button>
    <div class="section-title">Redewendungen</div>
    <div id="phrase-content"></div>
  </div>

  <!-- ALPHABET -->
  <div id="alphabet" class="screen">
    <button type="button" class="back-link" onclick="showLookup()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 6 9 12 15 18"></polyline></svg>Nachschlagen</button>
    <div class="section-title">Persisch-Arabisches Alphabet</div>
    <div id="alphabet-content"></div>
  </div>

  <!-- ÜBUNGEN -->
  <div id="uebungen" class="screen">
    <div id="uebungen-content"></div>
  </div>


</div>

<!-- UNTERE NAVIGATION -->
<nav class="tabbar" aria-label="Hauptnavigation">
  <button type="button" id="nav-flash" class="nav-btn active" onclick="show('flash', this)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="14" height="14" rx="2"></rect><path d="M7 6V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"></path></svg>
    Lernen
  </button>
  <button type="button" id="nav-lessons" class="nav-btn" onclick="show('lessons', this)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>
    Lektionen
  </button>
  <button type="button" id="nav-uebungen" class="nav-btn" onclick="show('uebungen',this);buildUebungen()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
    Übungen
  </button>
  <button type="button" id="nav-lookup" class="nav-btn" onclick="showLookup()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"></path><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"></path></svg>
    Nachschlagen
  </button>
</nav>

<!-- Vocab-Modal: außerhalb .app → fixed Overlay über gesamtes Fenster inkl. Header -->
<!-- PWA: Install-Hinweis (Chromium + iOS) -->
<div id="pwa-install-banner" class="pwa-install-banner" hidden role="dialog" aria-modal="true" aria-labelledby="pwa-install-heading">
  <div id="pwa-install-backdrop" class="pwa-install-backdrop" aria-hidden="true"></div>
  <div class="pwa-install-card" onclick="event.stopPropagation()">
    <h2 id="pwa-install-heading" class="pwa-install-title">App installieren</h2>
    <p class="pwa-install-text" id="pwa-install-text"></p>
    <label class="pwa-install-label">
      <input type="checkbox" id="pwa-install-never" />
      Nicht mehr anzeigen
    </label>
    <div class="pwa-install-actions">
      <button type="button" class="btn btn-primary" id="pwa-install-primary" hidden>Installieren</button>
      <button type="button" class="btn" id="pwa-install-dismiss">Schließen</button>
    </div>
  </div>
</div>

<div id="vocab-modal" class="vocab-modal-overlay" onclick="closeVocabModal(event)">
  <div class="vocab-modal" role="dialog" aria-modal="true" aria-labelledby="vocab-modal-title" onclick="event.stopPropagation()">
    <div class="vocab-modal-header">
      <span id="vocab-modal-title"></span>
      <button type="button" class="vocab-modal-close" onclick="closeVocabModal()" aria-label="Schließen">✕</button>
    </div>
    <div class="vocab-modal-body" id="vocab-modal-body"></div>
  </div>
</div>

<script>
  /* Language state — must be defined before all other scripts */
  let currentLang = localStorage.getItem('app_lang') || 'farsi';
  function getActiveVocab()         { return currentLang === 'french' ? FRENCH_VOCAB : currentLang === 'spanish' ? SPANISH_VOCAB : VOCAB; }
  function getActivePhrases()       { return currentLang === 'french' ? FRENCH_PHRASES : currentLang === 'spanish' ? SPANISH_PHRASES : PHRASES; }
  function getActiveSRSKey()        { return currentLang === 'french' ? 'french_srs' : currentLang === 'spanish' ? 'spanish_srs' : 'farsi_srs'; }
  function getActiveLessons()       { return currentLang === 'french' ? FRENCH_LESSONS : currentLang === 'spanish' ? SPANISH_LESSONS : LESSONS; }
  function getActiveLessonStateKey(){ return currentLang === 'french' ? 'french_lesson_state' : currentLang === 'spanish' ? 'spanish_lesson_state' : 'farsi_lesson_state'; }
</script>
<script src="js/french_data.js?v=2"></script>
<script src="js/spanish_data.js?v=2"></script>
<script src="js/data.js?v=2"></script>
<script src="js/lessons.js?v=3"></script>
<script src="js/french_lessons.js?v=1"></script>
<script src="js/spanish_lessons.js?v=1"></script>
<script src="js/srs.js?v=2"></script>
<script src="js/flashcard.js?v=4"></script>
<script src="js/vocab.js?v=2"></script>
<script src="grammar-data-farsi.js"></script>
<script src="js/grammar.js?v=3"></script>
<script src="js/phrases.js?v=2"></script>
<script>
const ALPHABET_DATA = [
  { id:'alef',    persian:'ا', roman:'â / a',  name:'Alef',     group:1, forms:{isolated:'ا',  initial:'ا',   medial:'ـا',  final:'ـا'},  similar_to:[],                        note:'Verbindet nicht nach links — immer gleiche Form' },
  { id:'be',      persian:'ب', roman:'b',       name:'Be',       group:1, forms:{isolated:'ب',  initial:'بـ',  medial:'ـبـ', final:'ـب'},  similar_to:['pe','te','se'],           note:'Ein Punkt darunter — verwechslungsgefährdet mit پ (3 Punkte) und ت (2 Punkte oben)' },
  { id:'pe',      persian:'پ', roman:'p',       name:'Pe',       group:1, forms:{isolated:'پ',  initial:'پـ',  medial:'ـپـ', final:'ـپ'},  similar_to:['be','te','se'],           note:'Drei Punkte darunter — persischer Buchstabe, nicht im Arabischen' },
  { id:'te',      persian:'ت', roman:'t',       name:'Te',       group:1, forms:{isolated:'ت',  initial:'تـ',  medial:'ـتـ', final:'ـت'},  similar_to:['be','pe','se'],           note:'Zwei Punkte oben' },
  { id:'se',      persian:'ث', roman:'s',       name:'Se',       group:1, forms:{isolated:'ث',  initial:'ثـ',  medial:'ـثـ', final:'ـث'},  similar_to:['be','pe','te'],           note:'Drei Punkte oben — selten in persischen Originalwörtern, meist arabische Lehnwörter' },
  { id:'jim',     persian:'ج', roman:'j',       name:'Jim',      group:2, forms:{isolated:'ج',  initial:'جـ',  medial:'ـجـ', final:'ـج'},  similar_to:['che','he_jimi','khe'],    note:'Ein Punkt darunter' },
  { id:'che',     persian:'چ', roman:'ch',      name:'Che',      group:2, forms:{isolated:'چ',  initial:'چـ',  medial:'ـچـ', final:'ـچ'},  similar_to:['jim','he_jimi','khe'],    note:'Drei Punkte darunter — persischer Buchstabe' },
  { id:'he_jimi', persian:'ح', roman:'h',       name:'He (jimi)',group:2, forms:{isolated:'ح',  initial:'حـ',  medial:'ـحـ', final:'ـح'},  similar_to:['jim','che','khe'],        note:'Keine Punkte — arabischer Ursprung, starkes H' },
  { id:'khe',     persian:'خ', roman:'kh',      name:'Khe',      group:2, forms:{isolated:'خ',  initial:'خـ',  medial:'ـخـ', final:'ـخ'},  similar_to:['jim','che','he_jimi'],    note:'Ein Punkt oben — wie "ch" in Bach' },
  { id:'dal',     persian:'د', roman:'d',       name:'Dal',      group:3, forms:{isolated:'د',  initial:'د',   medial:'ـد',  final:'ـد'},  similar_to:['zal'],                    note:'Verbindet nicht nach links' },
  { id:'zal',     persian:'ذ', roman:'z',       name:'Zal',      group:3, forms:{isolated:'ذ',  initial:'ذ',   medial:'ـذ',  final:'ـذ'},  similar_to:['dal'],                    note:'Ein Punkt oben — arabisches Lehnwort-Zeichen' },
  { id:'re',      persian:'ر', roman:'r',       name:'Re',       group:3, forms:{isolated:'ر',  initial:'ر',   medial:'ـر',  final:'ـر'},  similar_to:['ze','zhe'],               note:'Verbindet nicht nach links' },
  { id:'ze',      persian:'ز', roman:'z',       name:'Ze',       group:3, forms:{isolated:'ز',  initial:'ز',   medial:'ـز',  final:'ـز'},  similar_to:['re','zhe'],               note:'Ein Punkt oben — verbindet nicht nach links' },
  { id:'zhe',     persian:'ژ', roman:'zh',      name:'Zhe',      group:3, forms:{isolated:'ژ',  initial:'ژ',   medial:'ـژ',  final:'ـژ'},  similar_to:['re','ze'],                note:'Drei Punkte oben — persischer Buchstabe, wie franz. "j"' },
  { id:'sin',     persian:'س', roman:'s',       name:'Sin',      group:4, forms:{isolated:'س',  initial:'سـ',  medial:'ـسـ', final:'ـس'},  similar_to:['shin'],                   note:'Drei Zacken — keine Punkte' },
  { id:'shin',    persian:'ش', roman:'sh',      name:'Shin',     group:4, forms:{isolated:'ش',  initial:'شـ',  medial:'ـشـ', final:'ـش'},  similar_to:['sin'],                    note:'Drei Zacken mit drei Punkten oben' },
  { id:'sad',     persian:'ص', roman:'s',       name:'Sad',      group:4, forms:{isolated:'ص',  initial:'صـ',  medial:'ـصـ', final:'ـص'},  similar_to:['zad'],                    note:'Arabischer Ursprung — emphatisches S' },
  { id:'zad',     persian:'ض', roman:'z',       name:'Zad',      group:4, forms:{isolated:'ض',  initial:'ضـ',  medial:'ـضـ', final:'ـض'},  similar_to:['sad'],                    note:'Ein Punkt oben — arabischer Ursprung' },
  { id:'ta',      persian:'ط', roman:'t',       name:'Ta',       group:5, forms:{isolated:'ط',  initial:'طـ',  medial:'ـطـ', final:'ـط'},  similar_to:['za'],                     note:'Arabischer Ursprung — emphatisches T' },
  { id:'za',      persian:'ظ', roman:'z',       name:'Za',       group:5, forms:{isolated:'ظ',  initial:'ظـ',  medial:'ـظـ', final:'ـظ'},  similar_to:['ta'],                     note:'Ein Punkt oben — arabischer Ursprung' },
